services:
  GRAFANA:
    image: ${GF_IMAGE}
    volumes:
      - type: bind
        source: ${GF_DATA}
        target: /var/lib/grafana
      - type: bind
        source: ${GF_ETC}
        target: /etc/grafana
    ports:
      - '0.0.0.0:${GF_SERVER_HTTP_PORT}:3000'
    depends_on:
      - prometheus
    networks:
      - backbone
 
  PROM:
    image: ${PROM_IMAGE}
    volumes:
      - type: bind
        source: ${PROM_DATA}
        target: /prometheus
      - type: bind
        source: ${PROM_CONF}
        target: /etc/prometheus/prometheus.yml
    ports:
      - '0.0.0.0:${PROM_PORT}:9090'
    networks:
      - backbone

networks:
  backbone:
    name: chipprbackbone
    external: true
