version: "3.8"
services:
  COREGETH:
    image: ${IMAGE}
    networks:
      - backbone
    ports: 
      - 8545:8545
    volumes:
      - type: bind 
        source: ${DATA}
        target: /root
    command: 
      ${GETH_FLAGS}
    stop_grace_period: 100s

networks:
  backbone:
    name: chipprbackbone
    external: true
