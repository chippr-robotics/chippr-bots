services:
  PDS:
    image: ${PDS_IMAGE}
    networks: 
      - backbone
    volumes:
      - type: bind
        source: ${PDS_DATA}
        target: ${PDS_DATA_DIRECTORY}
    env_file:
      - ${PDS_DATA}/pds.env
    ports:
      - '0.0.0.0:${PDS_PORTS}:3000'
      
networks:
  backbone:
    name: chipprbackbone
    external: true
