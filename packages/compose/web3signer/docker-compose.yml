version: '3.8'
services:
  WEB3SIGNER:
    image: ${WEB3SIGNER_IMAGE}
    volumes:
      - type: bind
        source: ${WEB3SIGNER_DATA_PATH}
        target: /opt/web3Signer
    ports:
      - '${WEB3SIGNER_HTTP_LISTEN_EXT}:${WEB3SIGNER_HTTP_LISTEN_INT}'
      - '${WEB3SIGNER_RPC_EXT}:8545'
    command:
      ${SIGNER_FLAGS}
networks:
  backbone:
    name: chipprbackbone
    external: true
