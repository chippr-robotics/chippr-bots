version: '3.8'

services:
  lightwalletd:
    image: ${LWD_IMAGE}
    networks: 
      - backbone
    #entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    volumes:
        - type: bind
          source: ${LWD_CACHE}
          target: /var/lib/lightwalletd
    command: >
      - --zcash-conf-path=/var/lib/lightwalletd/zcash.conf
      - --grpc-bind-addr=0.0.0.0:8000
      - --http-bind-addr=0.0.0.0:8100
      - --log-file=/dev/stdout
      - --log-level=7
      - --rpchost=${LWD_ZEBRAHOST}
      - --rpcport=${LWD_ZEBRAPORT}
      - --tls-cert=${LWD_TLS_CERT}
      - --tls-key=${LWD_TLS_KEY}
    ports:
      - '${LWD_GRPC_PORT}:8000'
      - '${LWD_HTTP_PORT}:8100'

networks:
  backbone:
    name: chipprbackbone
    external: true
