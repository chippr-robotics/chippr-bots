# marketing-publish: the deterministic publisher tick (PLAN.md 2.4).
#
# - DRY-RUN unless BOTH keys are set: repo variable MARKETING_LIVE == 'true'
#   AND the tick is invoked with --live. Until issue #169 lands WIF + secrets,
#   every run is dry-run by construction.
# - concurrency group serializes ticks (never cancel a publish mid-flight).
# - Receipts live on the `receipts` ref, never primary — no bypass actor.
# - No `uses:` steps (gated by marketing/check.js G4).
# - Any failed tick files/updates an escalation issue (honest states: a red
#   cron that nobody sees is a silent skip).
name: marketing-publish

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: marketing-publish
  cancel-in-progress: false

permissions:
  contents: write        # push to the receipts ref only
  issues: write          # escalation issue
  pull-requests: read    # approval verification

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Check out primary (no actions)
        run: |
          git init --quiet repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin primary
          git checkout --quiet FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out receipts ref (create if absent)
        working-directory: repo
        run: |
          git worktree add ../receipts-checkout --detach
          cd ../receipts-checkout
          if git fetch --quiet --depth 1 origin receipts 2>/dev/null; then
            git checkout --quiet FETCH_HEAD
          else
            git checkout --quiet --orphan receipts
            git rm -rfq . 2>/dev/null || true
            echo "Publish receipts and claims. Written only by marketing-publish." > README.md
            git add README.md
          fi

      - name: Fetch secrets (live mode only; requires issue #169 WIF)
        if: ${{ vars.MARKETING_LIVE == 'true' }}
        run: echo "::error::Live mode requested but WIF secret delivery is not wired yet (issue #169)." && exit 1

      - name: Publisher tick (dry-run unless MARKETING_LIVE)
        working-directory: repo/marketing
        run: |
          npm ci --ignore-scripts
          if [ "${MARKETING_LIVE}" = "true" ]; then
            node pipeline/bin/tick.js --live --receipts-dir "${GITHUB_WORKSPACE}/receipts-checkout"
          else
            node pipeline/bin/tick.js --receipts-dir "${GITHUB_WORKSPACE}/receipts-checkout"
          fi
        env:
          MARKETING_LIVE: ${{ vars.MARKETING_LIVE }}
          GITHUB_TOKEN: ${{ github.token }}
          MARKETING_APPROVERS: ${{ vars.MARKETING_APPROVERS }}

      - name: Push receipts (rebase-retry)
        if: ${{ vars.MARKETING_LIVE == 'true' }}
        working-directory: receipts-checkout
        run: |
          git config user.name "chippr-marketing-publisher"
          git config user.email "bots@chipprbots.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no receipt changes"
            exit 0
          fi
          git commit -m "receipts: tick $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git push origin HEAD:receipts; then exit 0; fi
            git fetch origin receipts && git rebase FETCH_HEAD && sleep $((i*2))
          done
          echo "::error::receipts push failed after retries" && exit 1

      - name: Escalate on failure
        if: ${{ failure() }}
        run: |
          BODY=$(printf 'A marketing-publish tick failed: %s\n\nSee the run log. Honest-states rule: a red tick is an incident, not noise.\n\ncc @realcodywburns\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          EXISTING=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?labels=publisher-incident&state=open" | \
            node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=JSON.parse(d);console.log(a.length?a[0].number:"")}')
          )
          if [ -n "$EXISTING" ]; then
            curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${EXISTING}/comments" \
              -d "$(node -e 'console.log(JSON.stringify({body: process.argv[1]}))' "$BODY")"
          else
            curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
              -d "$(node -e 'console.log(JSON.stringify({title: "Publisher tick failing", body: process.argv[1], labels: ["publisher-incident"]}))' "$BODY")"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
