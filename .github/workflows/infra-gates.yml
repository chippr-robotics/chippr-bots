# infra-gates: PR checks for infra/terraform (issue #169).
# No `uses:` steps, no secrets, no id-token: a pull_request run must never hold credentials.
# terraform validate is NOT run here — it needs the private module repo (TF_MODULES_TOKEN) and
# belongs to the applying operator; fmt + the guardrail gate are what a PR proves.
name: infra-gates

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'scripts/infra/**'
      - '.github/workflows/infra-gates.yml'

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head (no actions)
        run: |
          git init --quiet repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth 1 origin "${HEAD_SHA}"
          git checkout --quiet FETCH_HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: IaC guardrails
        working-directory: repo
        run: node scripts/infra/check-iac-guardrails.js

      - name: Guardrail gate self-test
        working-directory: repo
        run: node --test "scripts/infra/__tests__/*.test.js"

      - name: terraform fmt
        working-directory: repo
        run: terraform version && terraform fmt -check -recursive infra/terraform
